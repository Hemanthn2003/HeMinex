<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <radialGradient id="core" cx="50%" cy="45%">
    <stop offset="0" stop-color="#083c73"/>
    <stop offset=".72" stop-color="#03182f"/>
    <stop offset="1" stop-color="#000912"/>
  </radialGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#00e5ff"/><stop offset=".5" stop-color="#238cff"/><stop offset="1" stop-color="#7b5cff"/>
  </linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>
  <style>
    .orbit1{animation:spin1 5s linear infinite;transform-origin:256px 256px}
    .orbit2{animation:spin2 8s linear infinite;transform-origin:256px 256px}
    .orbit3{animation:spin3 11s linear infinite;transform-origin:256px 256px}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes spin1{to{transform:rotate(360deg)}}
    @keyframes spin2{to{transform:rotate(-360deg)}}
    @keyframes spin3{to{transform:rotate(360deg)}}
    @keyframes pulse{50%{opacity:.55;transform:scale(1.045)}}
  </style>
</defs>

<circle class="pulse" cx="256" cy="256" r="132" fill="#008cff" opacity=".16" filter="url(#blur)"/>
<circle cx="256" cy="256" r="128" fill="url(#core)" stroke="#168cff" stroke-width="2" opacity=".98"/>
<circle cx="256" cy="256" r="139" fill="none" stroke="url(#blue)" stroke-width="8" opacity=".92" filter="url(#glow)"/>
<circle cx="256" cy="256" r="151" fill="none" stroke="#00dfff" stroke-width="2" stroke-dasharray="42 16 9 20" opacity=".75"/>

<g class="orbit1" fill="none" stroke="url(#blue)" stroke-width="5" filter="url(#glow)">
  <ellipse cx="256" cy="256" rx="196" ry="72"/>
  <circle cx="452" cy="256" r="9" fill="#00e5ff" stroke="none"/>
</g>
<g class="orbit2" fill="none" stroke="#168cff" stroke-width="3" opacity=".8" filter="url(#glow)">
  <ellipse cx="256" cy="256" rx="205" ry="91" transform="rotate(55 256 256)"/>
  <circle cx="256" cy="165" r="7" fill="#238cff" stroke="none"/>
</g>
<g class="orbit3" fill="none" stroke="#7b5cff" stroke-width="2" opacity=".55">
  <ellipse cx="256" cy="256" rx="218" ry="110" transform="rotate(-32 256 256)"/>
</g>

<!-- Clean telephone handset -->
<g transform="translate(256 256) rotate(-38)" filter="url(#glow)"
   fill="none" stroke="#f3fbff" stroke-width="27" stroke-linecap="round" stroke-linejoin="round">
  <path d="M-77-68c8-13 22-19 37-15l28 9c9 3 14 13 11 22l-10 29c-3 7-1 14 4 20l26 26c6 6 13 7 20 4l29-10c9-3 19 2 22 11l9 28c4 15-3 29-16 37-12 8-26 10-40 6-39-11-78-32-108-62S-118-58-129-97c-4-14-2-28 6-40 8-13 22-19 37-15l28 9c9 3 14 13 11 22l-10 29c-3 7-1 14 4 20l26 26c6 6 13 7 20 4z"/>
</g>

<g fill="#00dfff" filter="url(#glow)">
  <circle cx="91" cy="164" r="7"/><circle cx="421" cy="369" r="6"/>
  <circle cx="112" cy="389" r="4"/><circle cx="395" cy="119" r="4"/>
</g>
</svg>