<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7bd"/>
      <stop offset="30%" stop-color="#ffd95c"/>
      <stop offset="70%" stop-color="#f0c967" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#f0c967" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ringGold" x1="0" y1="0" x2="120" y2="120">
      <stop offset="0%" stop-color="#fff0a0"/>
      <stop offset="45%" stop-color="#f0c967"/>
      <stop offset="100%" stop-color="#c38b20"/>
    </linearGradient>

    <linearGradient id="ringCyan" x1="0" y1="0" x2="120" y2="120">
      <stop offset="0%" stop-color="#7de3ff"/>
      <stop offset="55%" stop-color="#31b7ff"/>
      <stop offset="100%" stop-color="#146ca8"/>
    </linearGradient>

    <filter id="glowGold" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowCyan" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="goldOrbit" d="M 60 8 A 52 52 0 1 1 59.9 8"/>
    <path id="cyanOrbit" d="M 60 15 A 45 45 0 1 0 60.1 15"/>
  </defs>

  <circle cx="60" cy="60" r="31" fill="url(#coreGlow)">
    <animate attributeName="r" values="28;34;28" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".55;1;.55" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="60" cy="60" r="28" stroke="url(#ringGold)" stroke-width="1.5" opacity=".78"
          stroke-dasharray="5 5" filter="url(#glowGold)">
    <animateTransform attributeName="transform" type="rotate"
      from="0 60 60" to="360 60 60" dur="6s" repeatCount="indefinite"/>
  </circle>

  <circle cx="60" cy="60" r="43" stroke="url(#ringCyan)" stroke-width="1.1" opacity=".52"
          stroke-dasharray="2 8" filter="url(#glowCyan)">
    <animateTransform attributeName="transform" type="rotate"
      from="360 60 60" to="0 60 60" dur="8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="60" cy="60" r="51" stroke="url(#ringGold)" stroke-width=".8" opacity=".28"
          stroke-dasharray="1 11">
    <animateTransform attributeName="transform" type="rotate"
      from="0 60 60" to="360 60 60" dur="11s" repeatCount="indefinite"/>
  </circle>

  <g filter="url(#glowGold)">
    <circle r="3.2" fill="#ffd95c">
      <animateMotion dur="4.8s" repeatCount="indefinite" rotate="auto">
        <mpath href="#goldOrbit"/>
      </animateMotion>
    </circle>
    <circle r="2" fill="#fff3a7">
      <animateMotion dur="3.2s" begin="-1.1s" repeatCount="indefinite" rotate="auto">
        <mpath href="#goldOrbit"/>
      </animateMotion>
    </circle>
  </g>

  <g filter="url(#glowCyan)">
    <circle r="2.4" fill="#6ddcff">
      <animateMotion dur="5.6s" repeatCount="indefinite" rotate="auto">
        <mpath href="#cyanOrbit"/>
      </animateMotion>
    </circle>
  </g>

  <!-- Up arrow -->
  <g filter="url(#glowGold)">
    <path d="M60 76V43" stroke="#ffe78a" stroke-width="4" stroke-linecap="round"/>
    <path d="M47 56L60 43L73 56" stroke="#ffe78a" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <circle cx="60" cy="60" r="22" stroke="#f0c967" stroke-width=".65" opacity=".35">
    <animate attributeName="r" values="20;25;20" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".15;.55;.15" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
